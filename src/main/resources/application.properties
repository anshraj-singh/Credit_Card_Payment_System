spring.application.name=credit-card-payment-system

# MongoDB Atlas Configuration (Dynamically Injected)
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

# SMTP Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Stripe Infrastructure Configurations
stripe.api.key=${STRIPE_API_KEY}
stripe.secretKey=${STRIPE_SECRET_KEY}

# External Generative Assistant Model Keys
external.gemini.api.key=${GEMINI_API_KEY}

# Security Validation Controls
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration=3600000